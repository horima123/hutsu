<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ブロックタイルの広さを数えよう</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* タッチ操作の誤作動防止とスムーズなアニメーション */
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f8fafc;
        }

        /* アニメーション定義 */
        @keyframes pop {
            0% { transform: scale(0.6); opacity: 0; }
            70% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 豪華な星の出現アニメーション */
        @keyframes star-pop-super {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: scale(1.6) rotate(15deg); opacity: 1; filter: drop-shadow(0 0 10px #f59e0b); }
            70% { transform: scale(0.9) rotate(-5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .animate-pop {
            animation: pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-star-super {
            animation: star-pop-super 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-bounce-short {
            animation: bounce-short 0.5s ease infinite;
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* ぽよんと弾むボタン・タイル用アニメーション */
        .animate-jelly {
            animation: jelly 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes jelly {
            0% { transform: scale(1); }
            30% { transform: scale(1.15, 0.85); }
            60% { transform: scale(0.9, 1.1); }
            100% { transform: scale(1); }
        }

        /* 押した感のある立体ボタン */
        .btn-3d {
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }

        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        /* SVG花丸用 */
        .hanamaru {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: stroke 1.2s ease-in-out forwards;
        }

        @keyframes stroke {
            to { stroke-dashoffset: 0; }
        }

        /* 紙吹雪の紙片 */
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            top: -20px;
            z-index: 50;
            opacity: 0.9;
            animation: fall 3s linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(720deg);
            }
        }
    </style>
</head>

    <!-- JavaScript ロジック -->
    <script>
        let currentLevel = 1;
        let currentQuestionIndex = 0;
        let totalQuestions = 5;

        let setQuestions = [];
        let selectedQ5Indices = new Set();
        let completedLevels = new Set();

        let currentTileCount = 0;
        let currentShapeCells = [];
        let tappedCells = new Set(); // タップしたセルのインデックス順を保持
        let currentInput = "";

        const tileColorPalette = [
            { bg: 'bg-emerald-400', bgTapped: 'bg-emerald-300', border: 'border-emerald-600', text: 'text-emerald-950' },
            { bg: 'bg-sky-400', bgTapped: 'bg-sky-300', border: 'border-sky-600', text: 'text-sky-950' },
            { bg: 'bg-amber-400', bgTapped: 'bg-amber-300', border: 'border-amber-600', text: 'text-amber-950' },
            { bg: 'bg-rose-400', bgTapped: 'bg-rose-300', border: 'border-rose-600', text: 'text-rose-950' },
            { bg: 'bg-purple-400', bgTapped: 'bg-purple-300', border: 'border-purple-600', text: 'text-purple-950' }
        ];
        let currentPalette = tileColorPalette[0];

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        // 音声読み上げ関数は削除

        function playSoundTap() {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playSoundCorrect() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                gain.gain.setValueAtTime(0.4, now + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.08);
                osc.stop(now + idx * 0.08 + 0.2);
            });
        }

        function playSoundWrong() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(120, now + 0.25);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
        }

        function launchConfetti() {
            const container = document.getElementById('confetti-container');
            if (!container) return;
            container.innerHTML = '';
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#facc15'];

            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti';
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const delay = Math.random() * 1.5;
                const size = Math.floor(Math.random() * 8) + 8;

                piece.style.backgroundColor = color;
                piece.style.left = `${left}%`;
                piece.style.animationDelay = `${delay}s`;
                piece.style.width = `${size}px`;
                piece.style.height = `${size}px`;
                container.appendChild(piece);
            }
        }

        function showStartScreen() {
            playSoundTap();
            document.getElementById('screen-start').classList.remove('hidden');
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-clear').classList.add('hidden');

            [1, 2, 3, 4].forEach(lvl => {
                const badge = document.getElementById(`hanamaru-level-${lvl}`);
                if (completedLevels.has(lvl)) {
                    badge.classList.remove('hidden');
                }
            });

            if (completedLevels.size === 4) {
                document.getElementById('all-clear-banner').classList.remove('hidden');
                speakCatText("ぜんぶクリア！おめでとうニャー！");
                launchConfetti();
            }
        }

        // クリア画面からのホームボタン専用遷移関数
        function showStartScreenFromClear() {
            playSoundTap();
            // すべての入力・ゲーム要素の表示状態やタイマーをリセット
            document.getElementById('screen-clear').classList.add('hidden');
            document.getElementById('screen-all-clear').classList.add('hidden');
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-start').classList.remove('hidden');

            [1, 2, 3, 4].forEach(lvl => {
                const badge = document.getElementById(`hanamaru-level-${lvl}`);
                if (completedLevels.has(lvl)) {
                    badge.classList.remove('hidden');
                }
            });
        }

        function showStartScreenFromAllClear() {
            playSoundTap();
            document.getElementById('screen-all-clear').classList.add('hidden');
            document.getElementById('screen-start').classList.remove('hidden');

            [1, 2, 3, 4].forEach(lvl => {
                const badge = document.getElementById(`hanamaru-level-${lvl}`);
                if (completedLevels.has(lvl)) {
                    badge.classList.remove('hidden');
                }
            });
        }

        function startGame(level) {
            playSoundTap();
            currentLevel = level;
            currentQuestionIndex = 0;
            
            const levelBadge = document.getElementById('level-badge');
            document.getElementById('display-level-text').textContent = `レベル${level}`;
            levelBadge.className = "px-6 py-1 rounded-full text-white font-black text-2xl flex items-center gap-2 ";
            if(level === 1) levelBadge.classList.add('bg-emerald-500');
            if(level === 2) levelBadge.classList.add('bg-sky-500');
            if(level === 3) levelBadge.classList.add('bg-indigo-500');
            if(level === 4) levelBadge.classList.add('bg-rose-500');

            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            document.getElementById('screen-clear').classList.add('hidden');

            generateSetQuestions();
            loadQuestion();
        }

        function restartCurrentLevel() {
            startGame(currentLevel);
        }

        // レベルに応じたマス数・形状の生成
        function generateSetQuestions() {
            setQuestions = [];
            
            // レベルごとの基本範囲設定
            let minC = 4, maxC = 6;
            if (currentLevel === 2) { minC = 5; maxC = 7; }
            if (currentLevel === 3) { minC = 6; maxC = 8; }
            if (currentLevel === 4) { minC = 7; maxC = 9; }

            // 5問目のペア用に正解マス数を1つ決定
            const pairCount = Math.floor(Math.random() * (maxC - minC + 1)) + minC;
            
            let otherCounts = [];
            while (otherCounts.length < 2) {
                let r = Math.floor(Math.random() * (maxC - minC + 1)) + minC;
                if (r !== pairCount && !otherCounts.includes(r)) {
                    otherCounts.push(r);
                }
            }

            let fourCounts = [pairCount, pairCount, otherCounts[0], otherCounts[1]];
            fourCounts.sort(() => Math.random() - 0.5);

            for (let i = 0; i < 4; i++) {
                const cnt = fourCounts[i];
                const shape = generateShapeForLevel(cnt, currentLevel);
                const palette = tileColorPalette[i % tileColorPalette.length];
                setQuestions.push({
                    count: cnt,
                    shapeCells: shape,
                    palette: palette
                });
            }
        }

        // レベルごとの特性に合わせたタイルの形状生成ロジック
        function generateShapeForLevel(targetCount, level) {
            const gridSize = 5;
            const board = Array(gridSize).fill(null).map(() => Array(gridSize).fill(false));
            
            let cells = [];

            if (level === 1) {
                // レベル1: 長方形やL字型などのまとまったシンプル形状
                const forms = ['rect', 'L'];
                const chosen = forms[Math.floor(Math.random() * forms.length)];

                if (chosen === 'rect' && targetCount <= 6) {
                    let w = targetCount <= 4 ? 2 : 3;
                    let h = Math.ceil(targetCount / w);
                    let startR = 1, startC = 1;
                    for (let r = 0; r < h; r++) {
                        for (let c = 0; c < w; c++) {
                            if (cells.length < targetCount) {
                                board[startR + r][startC + c] = true;
                                cells.push({r: startR + r, c: startC + c});
                            }
                        }
                    }
                } else {
                    return generatePolyomino(targetCount);
                }
            } else if (level === 2) {
                return generatePolyomino(targetCount);
            } else {
                return generatePolyomino(targetCount, true);
            }

            return cells.length === targetCount ? cells : generatePolyomino(targetCount);
        }

        function generatePolyomino(targetCount, complex = false) {
            const gridSize = 5;
            const board = Array(gridSize).fill(null).map(() => Array(gridSize).fill(false));
            
            let startR = Math.floor(Math.random() * 2) + 1;
            let startC = Math.floor(Math.random() * 2) + 1;
            
            let cells = [{r: startR, c: startC}];
            board[startR][startC] = true;

            const directions = [
                {r: -1, c: 0}, {r: 1, c: 0},
                {r: 0, c: -1}, {r: 0, c: 1}
            ];

            while (cells.length < targetCount) {
                const parent = complex && Math.random() > 0.3 ? cells[cells.length - 1] : cells[Math.floor(Math.random() * cells.length)];
                const dir = directions[Math.floor(Math.random() * directions.length)];
                const nr = parent.r + dir.r;
                const nc = parent.c + dir.c;

                if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && !board[nr][nc]) {
                    board[nr][nc] = true;
                    cells.push({r: nr, c: nc});
                }
            }
            return cells;
        }

        function updateStars() {
            const container = document.getElementById('star-container');
            container.innerHTML = '';
            for (let i = 0; i < totalQuestions; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'relative flex items-center justify-center';

                const star = document.createElement('i');
                if (i < currentQuestionIndex) {
                    star.className = 'fa-solid fa-star text-amber-400';
                    if (i === currentQuestionIndex - 1) {
                        star.classList.add('animate-star-super');
                    }
                } else {
                    star.className = 'fa-regular fa-star text-slate-300';
                }
                wrapper.appendChild(star);
                container.appendChild(wrapper);
            }
        }

        function loadQuestion() {
            updateStars();
            clearNumpad();
            tappedCells.clear();
            selectedQ5Indices.clear();

            const q14Container = document.getElementById('q1-4-container');
            const q5Container = document.getElementById('q5-container');
            const numpadContainer = document.getElementById('numpad-container');
            const q5SubmitContainer = document.getElementById('q5-submit-container');

            // 吹き出しテキストの更新
            const headerBubble = document.getElementById('cat-header-bubble-text');

            if (currentQuestionIndex < 4) {
                q14Container.classList.remove('hidden');
                q5Container.classList.add('hidden');
                numpadContainer.classList.remove('hidden');
                q5SubmitContainer.classList.add('hidden');

                const qData = setQuestions[currentQuestionIndex];
                currentTileCount = qData.count;
                currentShapeCells = qData.shapeCells;
                currentPalette = qData.palette;

                if (headerBubble) {
                    const prompts = [
                        "マスを かぞえてね！",
                        "いくつ あるかな？",
                        "ブロックの ひろさは？",
                        "がんばって かぞえよう！"
                    ];
                    headerBubble.textContent = prompts[currentQuestionIndex % prompts.length];
                }

                renderGridBackground();
                renderBoard();
            } else {
                q14Container.classList.add('hidden');
                q5Container.classList.remove('hidden');
                numpadContainer.classList.add('hidden');
                q5SubmitContainer.classList.remove('hidden');

                if (headerBubble) {
                    headerBubble.textContent = "おなじ ひろさを えらんでね！";
                }

                renderQ5Cards();
            }
        }

        function renderGridBackground() {
            const gridLayer = document.getElementById('grid-background-layer');
            gridLayer.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'border border-slate-300 box-border w-full h-full';
                gridLayer.appendChild(cell);
            }
        }

        // 隣接セル判定関数（外枠区切り線描画用）
        function hasTileAt(r, c) {
            return currentShapeCells.some(item => item.r === r && item.c === c);
        }

        function renderBoard() {
            const tileBoard = document.getElementById('tile-board');
            tileBoard.innerHTML = '';

            const gridSize = 5;
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'w-full h-full box-border relative flex items-center justify-center';

                    const cellIndex = currentShapeCells.findIndex(item => item.r === r && item.c === c);
                    const isTile = cellIndex !== -1;

                    if (isTile) {
                        cellDiv.classList.add('cursor-pointer', 'transition-all', 'duration-150');

                        const isTapped = tappedCells.has(cellIndex);

                        // レベルによる表示の分け方
                        if (currentLevel === 1) {
                            // レベル1: 最初からすべて区切り線あり
                            cellDiv.classList.add(currentPalette.bg, 'border-2', currentPalette.border);
                            if (isTapped) {
                                cellDiv.classList.add(currentPalette.bgTapped, 'shadow-inner');
                                const tapOrder = Array.from(tappedCells).indexOf(cellIndex) + 1;
                                cellDiv.innerHTML = `<span class="text-3xl md:text-5xl font-black ${currentPalette.text} animate-pop">${tapOrder}</span>`;
                            } else {
                                cellDiv.classList.add('shadow-md');
                            }
                        } 
                        else if (currentLevel === 2 || currentLevel === 3) {
                            // レベル2 & 3: 未タップは塊（外枠のみ境界線）、タップで個別区切り＋番号
                            cellDiv.classList.add(currentPalette.bg);

                            if (isTapped) {
                                // タップされたマス：個別に全周 border で区切る
                                cellDiv.classList.add(currentPalette.bgTapped, 'border-2', currentPalette.border, 'shadow-inner');
                                const tapOrder = Array.from(tappedCells).indexOf(cellIndex) + 1;
                                cellDiv.innerHTML = `<span class="text-3xl md:text-5xl font-black ${currentPalette.text} animate-pop">${tapOrder}</span>`;
                            } else {
                                // 未タップのマス：隣にタイルがない外縁部分のみに border を付けて「塊」を演出
                                let borderClasses = [];
                                if (!hasTileAt(r - 1, c)) borderClasses.push('border-t-4');
                                if (!hasTileAt(r + 1, c)) borderClasses.push('border-b-4');
                                if (!hasTileAt(r, c - 1)) borderClasses.push('border-l-4');
                                if (!hasTileAt(r, c + 1)) borderClasses.push('border-r-4');
                                
                                cellDiv.classList.add(...borderClasses, currentPalette.border);
                            }
                        } 
                        else if (currentLevel === 4) {
                            // レベル4: 完全なひとつの塊。タップしても一切変化なし（補助なしで数える）
                            cellDiv.classList.add(currentPalette.bg);

                            let borderClasses = [];
                            if (!hasTileAt(r - 1, c)) borderClasses.push('border-t-4');
                            if (!hasTileAt(r + 1, c)) borderClasses.push('border-b-4');
                            if (!hasTileAt(r, c - 1)) borderClasses.push('border-l-4');
                            if (!hasTileAt(r, c + 1)) borderClasses.push('border-r-4');

                            cellDiv.classList.add(...borderClasses, currentPalette.border);

                            // レベル4はタップによる色変化などの視覚効果も完全に無し
                        }

                        cellDiv.onclick = (e) => {
                            e.currentTarget.classList.remove('animate-jelly');
                            void e.currentTarget.offsetWidth;
                            e.currentTarget.classList.add('animate-jelly');
                            onCellClick(cellIndex, cellDiv);
                        };
                    }

                    tileBoard.appendChild(cellDiv);
                }
            }
        }

        function renderQ5Cards() {
            const container = document.getElementById('q5-cards-grid');
            if (!container) return;
            container.innerHTML = '';

            setQuestions.forEach((qData, idx) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `relative p-2 md:p-3 bg-white rounded-2xl border-4 cursor-pointer transition-all flex flex-col items-center justify-center shadow-md ${selectedQ5Indices.has(idx) ? 'border-blue-500 scale-105 shadow-xl bg-blue-50 ring-4 ring-blue-300' : 'border-slate-300 hover:border-slate-400'}`;
                
                const miniBoard = document.createElement('div');
                miniBoard.className = 'relative grid grid-cols-5 grid-rows-5 rounded-lg overflow-hidden border border-slate-300 bg-white shadow-inner w-full aspect-square max-w-[160px] md:max-w-[180px]';

                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'border border-slate-100 box-border w-full h-full';

                        const isTile = qData.shapeCells.some(item => item.r === r && item.c === c);
                        if (isTile) {
                            cell.classList.add(qData.palette.bg, 'border', qData.palette.border);
                        }
                        miniBoard.appendChild(cell);
                    }
                }

                cardDiv.appendChild(miniBoard);

                const countBadge = document.createElement('div');
                countBadge.className = 'mt-2 px-3 py-0.5 rounded-full bg-slate-100 border-2 border-slate-300 text-slate-800 font-black text-xl md:text-2xl flex items-center justify-center';
                countBadge.innerHTML = `<span>${qData.count} マス</span>`;
                cardDiv.appendChild(countBadge);

                cardDiv.onclick = () => {
                    playSoundTap();
                    if (selectedQ5Indices.has(idx)) {
                        selectedQ5Indices.delete(idx);
                    } else {
                        if (selectedQ5Indices.size < 2) {
                            selectedQ5Indices.add(idx);
                        }
                    }
                    renderQ5Cards();
                };

                container.appendChild(cardDiv);
            });
        }

        function onCellClick(cellIndex, element) {
            if (cellIndex === -1) return;

            if (tappedCells.has(cellIndex)) {
                tappedCells.delete(cellIndex);
                playSoundTap();
            } else {
                // レベル3の場合は最大3マスまでに制限
                if (currentLevel === 3 && tappedCells.size >= 3) {
                    playSoundWrong();
                    if (element) {
                        element.classList.remove('animate-shake');
                        void element.offsetWidth;
                        element.classList.add('animate-shake');
                    }
                    return;
                }

                tappedCells.add(cellIndex);
                playSoundTap();
            }

            renderBoard();
        }

        function pressNumpad(numStr) {
            playSoundTap();
            if (currentInput.length < 2) {
                currentInput += numStr;
                updateInputDisplay();
            }
        }

        function clearNumpad() {
            playSoundTap();
            currentInput = "";
            updateInputDisplay();
        }

        function updateInputDisplay() {
            const display = document.getElementById('input-display');
            display.textContent = currentInput;
        }

        function showCatSuccessModal(customText, callback) {
            const catModal = document.getElementById('cat-modal');

            catModal.classList.remove('hidden');

            const displayTime = 1000;
            setTimeout(() => {
                catModal.classList.add('hidden');
                if (callback) callback();
            }, displayTime);
        }

        function submitAnswer() {
            if (currentInput === "") return;
            const userAns = parseInt(currentInput, 10);

            if (userAns === currentTileCount) {
                playSoundCorrect();
                currentQuestionIndex++;

                showCatSuccessModal(null, () => {
                    loadQuestion();
                });
            } else {
                playSoundWrong();
                const feedback = document.getElementById('feedback-wrong');
                feedback.classList.remove('hidden');
                setTimeout(() => {
                    feedback.classList.add('hidden');
                    clearNumpad();
                }, 600);
            }
        }

        function submitQ5Answer() {
            if (selectedQ5Indices.size !== 2) return;

            const selectedArray = Array.from(selectedQ5Indices);
            const count1 = setQuestions[selectedArray[0]].count;
            const count2 = setQuestions[selectedArray[1]].count;

            if (count1 === count2) {
                playSoundCorrect();
                currentQuestionIndex++;
                updateStars();
                completedLevels.add(currentLevel);

                showCatSuccessModal(null, () => {
                    document.getElementById('screen-game').classList.add('hidden');

                    // レベル1〜4すべてクリアしているかチェック
                    if (completedLevels.has(1) && completedLevels.has(2) && completedLevels.has(3) && completedLevels.has(4)) {
                        document.getElementById('screen-all-clear').classList.remove('hidden');
                        launchConfettiCustom('all-clear-confetti-container');
                    } else {
                        document.getElementById('screen-clear').classList.remove('hidden');
                        launchConfetti();
                    }
                });
            } else {
                playSoundWrong();
                const feedback = document.getElementById('feedback-wrong');
                feedback.classList.remove('hidden');
                setTimeout(() => {
                    feedback.classList.add('hidden');
                }, 600);
            }
        }

        function launchConfettiCustom(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#facc15'];

            for (let i = 0; i < 80; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti';
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const delay = Math.random() * 2;
                const size = Math.floor(Math.random() * 8) + 8;

                piece.style.backgroundColor = color;
                piece.style.left = `${left}%`;
                piece.style.animationDelay = `${delay}s`;
                piece.style.width = `${size}px`;
                piece.style.height = `${size}px`;
                container.appendChild(piece);
            }
        }

        window.onload = () => {
            showStartScreen();
        };
    </script>
